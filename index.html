<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENOME - Bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            cursor: none !important;
        }

        body {
            background-color: #000;
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #mouse-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 25px;
            height: 25px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            mix-blend-mode: difference;
        }

        #mouse-cursor::before,
        #mouse-cursor::after {
            content: '';
            position: absolute;
            background: white;
            box-shadow: 0 0 8px white;
        }

        #mouse-cursor::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }

        #mouse-cursor::after {
            left: 50%;
            top: 0;
            height: 100%;
            width: 2px;
            transform: translateX(-50%);
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: -1;
            filter: brightness(0.5);
        }

        #enter-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        #enter-text {
            font-size: 20px;
            animation: pulse 2s infinite;
        }

        #main-content {
            display: none;
            opacity: 0;
            transition: 1s;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            width: 450px;
            text-align: center;
        }

        .pfp img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .username {
            font-size: 38px;
            margin-top: 10px;
        }

        .badges i {
            margin: 5px;
        }

        .links a {
            color: white;
            font-size: 24px;
            margin: 0 10px;
        }

        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            opacity: 0.6;
        }

        @keyframes pulse {
            0%,100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>

<body>

<div id="mouse-cursor"></div>

<video autoplay muted loop id="bg-video">
    <source src="background.mp4" type="video/mp4">
</video>

<div id="enter-screen">
    <div id="enter-text">click to enter...</div>
</div>

<div id="main-content">
    <div class="card">
        
        <div class="pfp">
            <img src="pfp.gif" alt="pfp">
        </div>

        <div class="username">VENOME</div>

        <div class="badges">
            <i class="fa-solid fa-crown"></i>
            <i class="fa-solid fa-code"></i>
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <div class="links">
            <a href="https://discord.gg/nakkhorto" target="_blank"><i class="fa-brands fa-discord"></i></a>
            <a href="https://github.com/venome814/l" target="_blank"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.instagram.com/venome00007?igsh=ODl6aGp4dG9mcTNi" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://discord.com/oauth2/authorize?client_id=1468997990575378432&permissions=824671333721&scope=bot%20applications.commands" target="_blank"><i class="fa-solid fa-robot"></i></a>
        </div>

    </div>
</div>

<div class="watermark">made by VENOME</div>

<script>
const enterScreen = document.getElementById("enter-screen");
const mainContent = document.getElementById("main-content");
const video = document.getElementById("bg-video");

enterScreen.addEventListener("click", () => {
    enterScreen.style.display = "none";
    mainContent.style.display = "flex";
    setTimeout(()=> mainContent.style.opacity = "1", 100);
    video.muted = false;
    video.volume = 0.5;
    video.play();
});
</script>

</body>
</html>
